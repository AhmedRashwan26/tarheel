name: tarheel_app
description: "Production mobile application for Tarheel passenger ride scheduling and delivery platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Networking & Real-Time
  dio: ^5.8.0+1
  socket_io_client: ^3.0.2
  
  # State Management
  provider: ^6.1.2
  
  # Typography & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  shimmer: ^3.0.0
  
  # Storage
  shared_preferences: ^2.5.2
  
  # Device Features & Media
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  audioplayers: ^6.1.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#ffffff"
    theme_color: "#1E3A8A"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo.png
    - assets/images/logo.jpg

