name: tarheel_app
description: "Production mobile application for Tarheel passenger ride scheduling and delivery platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Networking & Real-Time
  dio: ^5.8.0+1
  socket_io_client: ^3.0.2
  
  # State Management
  provider: ^6.1.2
  
  # Typography & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  shimmer: ^3.0.0
  
  # Storage
  shared_preferences: ^2.5.2
  
  # Device Features & Media
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  audioplayers: ^6.1.0
  record: ^5.2.1
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
