version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: tarheel_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tarheel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tarheel_secret_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-tarheel_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tarheel} -d ${POSTGRES_DB:-tarheel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tarheel_network

  # 2. Redis Cache & Job Queue Service
  redis:
    image: redis:7-alpine
    container_name: tarheel_redis_prod
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    networks:
      - tarheel_network

  # 3. Tarheel NestJS Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tarheel_backend_prod
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-tarheel}:${POSTGRES_PASSWORD:-tarheel_secret_secure_2026}@postgres:5432/${POSTGRES_DB:-tarheel_db}?schema=public"
      JWT_SECRET: "${JWT_SECRET:-tarheel_super_secure_jwt_secret_key_2026_production_grade}"
      JWT_EXPIRES_IN: "7d"
      PLATFORM_COMMISSION_PERCENTAGE: 10
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      UPLOAD_DIR: "./uploads"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - tarheel_network

  # 4. Nginx Web Server (Serves Flutter Web & Reverse Proxies API)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: tarheel_web_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - tarheel_network

networks:
  tarheel_network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
